# -*- coding: utf-8 -*-
# =====================================================================
# userinfo-case.yaml  用户信息接口自动化测试数据（数据驱动）
# 用例来源：Product/Interrogation Test Case.xlsx（Interrogation_001~022）
# 覆盖接口：
#   GET  /api/user/checkToken        （token 校验）
#   GET  /api/getCode/sms/{phone}    （注册短信验证码）
#   POST /api/user/regist            （注册）
#   POST /api/user/login             （登录）
# 字段说明：
#   case_id     : 对应 Excel 测试用例编号，便于需求追溯
#   interface   : 接口分组，测试类据此挑选符合该接口的用例
#   priority    : 优先级（Excel 中的 M/H）
#   condition   : 前置用例编号（如 006 表示需先执行“获取短信验证码”用例）
#   skip        : true 表示该用例为前端校验项，接口层无法自动化，仅保留做用例追溯
#   request     : type 请求方式；params 为 GET 查询参数 / POST JSON 请求体；
#                 params 中值为 null 表示不传该字段；form-data 为表单数据
#   assert      : status 为期望 HTTP 状态码；checks 为 JSONPath 断言列表，
#                 type 支持 eq / ne / contains / not_contains / not_null
#   extract     : 将响应字段提取到全局变量（写入 global-variable.properties）
#   ${xxx}      : 全局变量占位符，取值见 global-variable.properties
# =====================================================================

# ---------------------------- token 校验 ----------------------------
'001':
  case_id: ''
  interface: 'checkToken'
  title: 'token请求头为空'
  priority: 'M'
  condition:
  remark: 'token 为空时返回未登录'
  skip: false
  request:
    type: 'get'
    url: '${base_url}user/checkToken'
    headers:
      Content-Type: 'application/json'
      token: ''
    params: {}
    form-data: {}
  assert:
    status: 200
    checks:
      - path: '$.code'
        type: 'eq'
        expected: -211
      - path: '$.message'
        type: 'eq'
        expected: '未登录'
  extract:

'002':
